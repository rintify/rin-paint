<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>rin-paint</title>
    <meta name="theme-color" content="#12141a" />
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; background: #12141a; }
      html { color-scheme: dark; }
      body { overflow: hidden; }
      .app { opacity: 1; transition: opacity 240ms ease-out; }
      .app-starting { opacity: 0; visibility: hidden; }
      .startup-screen {
        position: fixed; inset: 0; z-index: 1400; display: flex;
        align-items: center; justify-content: center; flex-direction: column;
        gap: 18px; background: #12141a; color: #e8eaee;
        font: 13px 'Hiragino Sans', 'Yu Gothic UI', system-ui, sans-serif;
        opacity: 1; transition: opacity 240ms ease-out, visibility 0s linear 240ms;
      }
      .startup-screen[aria-hidden="true"] { opacity: 0; visibility: hidden; pointer-events: none; }
      .startup-screen { overflow: hidden; isolation: isolate; }
      .startup-screen::before {
        content: ''; position: absolute; inset: 0; z-index: -1;
        background: radial-gradient(ellipse at 50% 45%, #234172 0%, #192138 30%, #12141a 65%);
        opacity: .65;
      }
      .startup-brand { display: flex; flex-direction: column; align-items: center; width: 100%; }
      .startup-stage { position: relative; width: min(500px, 90vw, 76svh); aspect-ratio: 440 / 300; }
      /* Animate HTML surfaces, not SVG geometry: each drawing can be cached. */
      .startup-motion { position: absolute; inset: 0; transform-origin: center; will-change: transform, opacity; }
      .startup-motion svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .startup-orbit { animation: startup-orbit 8800ms linear infinite; }
      .startup-sparks { animation: startup-burst 4400ms cubic-bezier(.16, 1, .3, 1) infinite; }
      .startup-ripple { animation: startup-ripple 4400ms ease-out infinite; }
      .startup-glyph { animation: startup-glyph 4400ms cubic-bezier(.2, .8, .2, 1) infinite; }
      .startup-wordmark { font-size: clamp(32px, 7vw, 46px); font-weight: 650; letter-spacing: -1.8px; line-height: 1; }
      .startup-wordmark span { color: #a8bcda; font-weight: 350; }
      .startup-caption { color: #a0a7b4; font-size: 11px; letter-spacing: .16em; margin-top: 10px; }
      .startup-screen[aria-hidden="true"] .startup-motion { animation-play-state: paused; will-change: auto; }
      .startup-screen button {
        font: inherit; color: #fff; background: #35507e; border: 1px solid #4f8cff;
        border-radius: 6px; padding: 8px 16px; cursor: pointer;
      }
      @keyframes startup-orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes startup-burst {
        0%, 15% { opacity: 0; transform: scale(.25) rotate(-25deg); }
        23% { opacity: 1; }
        60% { opacity: .8; transform: scale(1) rotate(8deg); }
        85%, 100% { opacity: 0; transform: scale(.25) rotate(45deg); }
      }
      @keyframes startup-ripple {
        0%, 20% { opacity: 0; transform: scale(.2); }
        28% { opacity: .55; }
        65%, 100% { opacity: 0; transform: scale(1.7); }
      }
      @keyframes startup-glyph {
        0%, 100% { transform: scale(.88) rotate(-10deg); }
        30% { transform: scale(1.08) rotate(4deg); }
        48%, 75% { transform: scale(1) rotate(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app, .startup-screen { transition: none; }
        .startup-motion { animation: none; will-change: auto; }
        .startup-sparks, .startup-ripple { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-screen" role="status" aria-live="polite" aria-hidden="false">
        <div class="startup-brand" aria-hidden="true">
          <div class="startup-stage">
            <div class="startup-motion startup-orbit">
              <svg viewBox="0 0 440 300" fill="none" stroke-linecap="round">
                <ellipse cx="220" cy="150" rx="176" ry="95" stroke="#568aff" opacity=".25" />
                <path stroke="#4f8cff" stroke-width="9" d="M41 195 C-5 96 255 8 363 63 C420 92 399 142 351 181" />
                <path stroke="#ff729e" stroke-width="5" d="M370 224 C445 128 259 33 129 49" />
                <path stroke="#efc568" stroke-width="3" d="M72 231 C-10 151 184 12 322 57" />
              </svg>
            </div>
            <div class="startup-motion startup-ripple">
              <svg viewBox="0 0 440 300" fill="none"><circle cx="220" cy="150" r="74" stroke="#89b4ff" /></svg>
            </div>
            <div class="startup-motion startup-sparks">
              <svg viewBox="0 0 440 300" fill="#7cabff" stroke-linecap="round">
                <circle cx="64" cy="112" r="5" /><circle cx="356" cy="78" r="4" />
                <circle cx="332" cy="247" r="6" /><circle cx="102" cy="240" r="3" />
                <path d="M128 47 l-9 -15 M386 161 l17 3 M200 262 l-3 15" stroke="#7cabff" stroke-width="4" />
                <g fill="#efc568"><circle cx="90" cy="175" r="4" /><circle cx="270" cy="38" r="3" /><circle cx="371" cy="206" r="4" /></g>
                <path d="M158 242 l-7 10 M316 76 l8 -10" stroke="#ff729e" stroke-width="5" />
              </svg>
            </div>
            <div class="startup-motion startup-glyph">
              <svg viewBox="0 0 440 300" fill="none">
                <g transform="translate(168 98)">
                  <rect x="7" y="7" width="90" height="90" rx="26" fill="#121b2d" stroke="#759dde" stroke-opacity=".35" />
                  <path stroke="#78a8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M27 69 C35 53 49 36 65 25 C72 20 80 28 74 35 C64 47 48 58 34 62 C46 53 62 49 66 55 C71 63 50 72 58 77 C63 80 72 75 78 69" />
                  <circle cx="26" cy="76" r="3" fill="#efc568" />
                </g>
              </svg>
            </div>
          </div>
          <div class="startup-wordmark">rin<span>-paint</span></div>
        </div>
        <span class="startup-caption">読み込み中…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
